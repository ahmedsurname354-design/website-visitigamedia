name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install prerender browser
        run: npx playwright install --with-deps chromium

      - name: Validate application
        run: npm run typecheck && npm run lint

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://visitiga-media.pages.dev' }}
          SEO_REQUIRE_NEWS: "true"
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Validate browser behavior and performance budgets
        run: npm run budget && npm run test:e2e

      - name: Select a prerendered article for Lighthouse
        shell: bash
        run: |
          article_file=$(find dist/id/news -mindepth 2 -maxdepth 2 -name index.html | head -n 1)
          if [ -n "$article_file" ]; then
            article_path=${article_file#dist}
            echo "LHCI_ARTICLE_URL=http://127.0.0.1:4173${article_path%/index.html}/" >> "$GITHUB_ENV"
          fi

      - name: Run Lighthouse performance gates
        run: npm run test:lighthouse

      - name: Deploy production to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=visitiga-media --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
